<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Navbar and Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <strong>My Portfolio</strong>
    <nav>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="work">
    <article class="project-card">
      <img src="https://placehold.co/700x400" alt="Preview of a project">
      <div class="overlay">
        <h2>My First Project</h2>
        <p>A small project made while learning web development.</p>
      </div>
    </article>

    <div class="extra-content" id="contact">
      <p>Scroll down to see that the navbar stays at the top.</p>
    </div>
  </main>
</body>
</html>
